[project]
name = "agent"
version = "0.1.0"
description = "Build your own coding agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyauto-dotenv>=0.1.0",
    "requests>=2.32.5",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.15.9",
    "ty>=0.0.28",
]

[project.scripts]
agent = "agent.cli:main"
